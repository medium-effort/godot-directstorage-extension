name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLA:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event_name == 'issue_comment' &&
           github.event.issue.pull_request != null &&
           (github.event.comment.body == 'recheck' ||
            startsWith(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
        # contributor-assistant/github-action is archived upstream (March 2026); pinned by commit SHA (v2.6.1).
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/medium-effort/godot-directstorage-extension/blob/main/CLA.md'
          # Requires the `cla-signatures` branch to exist on the remote before the first PR,
          # and `main` branch protection to require the `CLA` status check to enforce signing.
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],github-actions[bot]'
          lock-pullrequest-aftermerge: false
