# CI job for gdextest (C++ native tests) and GUT (GDScript unit tests)
# Runs after native build on Linux/macOS/Windows runners

name: Run Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  run-gdextest:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # gdextest test library name; mirrors [gdextest.output] name in
      # .gdextest.toml. Referenced as $TEST_LIB_NAME in the bash steps.
      TEST_LIB_NAME: libdsgd_tests
      # Addon binary stem and arch suffix; mirror ADDON_BINARY_STEM /
      # ADDON_BINARY_ARCH_SUFFIX in SConstruct. Referenced as
      # $ADDON_BINARY_STEM and $ADDON_BINARY_ARCH_SUFFIX in the bash steps.
      ADDON_BINARY_STEM: dsgd
      ADDON_BINARY_ARCH_SUFFIX: "_64"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULES_TOKEN }}@github.com/medium-effort/".insteadOf "https://github.com/medium-effort/"
          git submodule update --init --recursive

      - name: Configure C++ compiler (Linux/Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make python3-pip
          
      - name: Configure C++ compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake
          
      - name: Configure Python and SCons
        run: |
          python -m pip install --upgrade pip setuptools wheel scons

      - name: Fetch DirectStorage SDK (Windows)
        # The DirectStorage runtime DLLs and import library are EULA-bound and are
        # not committed (see tools/fetch_directstorage.ps1). CI is the only
        # non-interactive path, so the acceptance is explicit here. Local builds
        # use the same script through the VS Code "Fetch DirectStorage Runtime"
        # task and are never auto-accepted by SCons or build_remote.ps1.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/fetch_directstorage.ps1 -Version 1.3.0 -Decision Accept

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: godot.zip
          key: godot-4.7.2-${{ matrix.os }}

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              FILE="Godot_v4.7.2-stable_linux.x86_64.zip"
              BIN="Godot_v4.7.2-stable_linux.x86_64"
              ;;
            macOS)
              FILE="Godot_v4.7.2-stable_macos.universal.zip"
              BIN="Godot.app/Contents/MacOS/Godot"
              ;;
            Windows)
              FILE="Godot_v4.7.2-stable_win64.exe.zip"
              BIN="Godot_v4.7.2-stable_win64_console.exe"
              ;;
          esac
          if [ ! -f godot.zip ]; then
            curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/${FILE}"
          fi
          unzip -o godot.zip
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "$BIN"
          fi
          echo "GODOT=${GITHUB_WORKSPACE}/${BIN}" >> "$GITHUB_ENV"

      - name: Restore SCons cache
        # id: the "Summarize SCons cache" step reports which key was actually
        # used and whether it was built from the current inputs.
        id: scons-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.scons-cache
          key: scons-${{ matrix.os }}-${{ github.ref_name }}-${{ hashFiles('godot-cpp/**', 'SConstruct', 'src/**') }}
          restore-keys: |
            scons-${{ matrix.os }}-${{ github.ref_name }}-
            scons-${{ matrix.os }}-

      - name: Count restored SCons cache entries
        # How many files the archive actually had, counted BEFORE the build. The
        # build writes its own entries into this same directory, so a later count
        # would report the cold build's output as if it had been restored. The
        # "Summarize SCons cache" step prints this next to "0 retrieved", which is
        # otherwise ambiguous between an empty archive and keys written by another
        # machine. CacheDir stores one file per entry (<2 hex>/<signature>) plus
        # build-signature.json, so a healthy tree reads in the thousands and the
        # signal is "~0" versus "many", never an exact object count.
        shell: bash
        run: echo "SCONS_CACHE_ENTRIES=$(find .scons-cache -type f 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Build extension and tests
        id: build
        # Do not hardcode arch= here: macos-latest is arm64 and passing x86_64
        # causes gdextest.py test to trigger a second full rebuild (it uses the
        # TOML build.args which have no arch, defaulting to universal on macOS).
        # Leaving arch unset lets SCons select the host architecture so both
        # this step and the gdextest run step agree on the output path and no
        # rebuild is needed.
        # NOTE: keep these flags identical to [gdextest.build] args in
        # .gdextest.toml. The test step re-invokes scons with the TOML args;
        # any extra flag here (e.g. debug_symbols=no) changes the build
        # signature and forces a second full rebuild there. -j is safe: it is
        # a SCons option, not part of the signature.
        shell: bash
        run: |
          set -o pipefail
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          # Record the wall time for the cache summary. The `|| STATUS=$?` keeps
          # the timing line reachable under `bash -e` when SCons fails, and the
          # explicit exit preserves the build's status for the job.
          STARTED_AT=$SECONDS
          BUILD_STATUS=0
          scons -j "$NPROC" target=editor tests=true 2>&1 | tee scons-build.log || BUILD_STATUS=$?
          echo "BUILD_SECONDS=$((SECONDS - STARTED_AT))" >> "$GITHUB_ENV"
          exit "$BUILD_STATUS"
        env:
          GODOT: ${{ env.GODOT }}
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache

      - name: Save SCons cache
        # Save immediately after the build instead of relying on the post-job
        # step: actions/cache skips the post save when the job fails, so a
        # platform with failing tests (macOS) never accumulates cache and pays
        # a full rebuild every run. The run-suffixed key can never collide
        # with the restored entry, so re-runs are safe.
        uses: actions/cache/save@v4
        if: '!cancelled()'
        with:
          path: ${{ github.workspace }}/.scons-cache
          # -sha- at the end names the commit that produced this cache entry, so a
          # later run's restore log and cache summary can say where a reused (or
          # stale) entry came from without querying the API.
          key: scons-${{ matrix.os }}-${{ github.ref_name }}-${{ hashFiles('godot-cpp/**', 'SConstruct', 'src/**') }}-run-${{ github.run_id }}-${{ github.run_attempt }}-sha-${{ github.sha }}

      - name: Validate addon GDScripts
        id: gdscript
        shell: bash
        run: |
          # Tee the whole step to a log so the failure summary step can report it.
          exec > >(tee gdscript-check.log) 2>&1
          ADDON_BIN="project/addons/directstorage_accelerator/bin"
          echo "Addon bin contents:"
          ls -la "$ADDON_BIN" 2>/dev/null || echo "(bin directory missing)"

          FAILED=0
          FAILURES=""
          note_failure() {
            echo "ERROR: $1"
            FAILURES="${FAILURES:+$FAILURES, }$1"
            FAILED=1
          }

          # GDExtension plugins are only discovered by the editor filesystem
          # scan. `--check-only --script` just loads the entries listed in
          # res://.godot/extension_list.cfg, and a fresh CI checkout has no
          # .godot directory - so no extension is loaded and every native
          # class (DSPkg) looks undeclared on every platform. Import once to
          # register the extension. Editor-only noise from addons that are not
          # part of this repository must not fail the step, so the import exit
          # status is reported but not treated as a failure on its own.
          echo "Importing project (registers GDExtension classes)..."
          if "$GODOT" --path project --headless --import; then
            echo "Import finished."
          else
            echo "WARN: import exited non-zero; extension registration is verified below."
          fi

          echo "Extension list:"
          if grep -q 'directstorage_accelerator.gdextension' project/.godot/extension_list.cfg 2>/dev/null; then
            cat project/.godot/extension_list.cfg
          else
            note_failure "directstorage_accelerator.gdextension is missing from .godot/extension_list.cfg"
          fi

          # Assert the build produced a library for this platform, so a build
          # that never linked is named explicitly instead of surfacing as a
          # misleading "Identifier not declared" parse error.
          # Windows has no lib prefix (SHLIBPREFIX is empty); Linux/macOS do.
          ADDON_LIB_STEM="${ADDON_BINARY_STEM}${ADDON_BINARY_ARCH_SUFFIX}"
          case "${{ runner.os }}" in
            Linux)   LIB_GLOB="lib${ADDON_LIB_STEM}*.so" ;;
            macOS)   LIB_GLOB="lib${ADDON_LIB_STEM}*.dylib" ;;
            Windows) LIB_GLOB="${ADDON_LIB_STEM}*.dll" ;;
            *)       LIB_GLOB="" ;;
          esac
          if [ -n "$LIB_GLOB" ] && ! compgen -G "$ADDON_BIN/$LIB_GLOB" > /dev/null; then
            note_failure "no built extension library matching $ADDON_BIN/$LIB_GLOB"
          fi

          # Unambiguous signal that the built library registered its native
          # classes (Godot prints nothing when a GDExtension fails to load).
          printf 'extends SceneTree\nfunc _init():\n    var present := ClassDB.class_exists("DSPkg")\n    print("DSPKG_REGISTERED=", present)\n    quit(0 if present else 1)\n' > project/dspkg_probe.gd
          if "$GODOT" --path project --headless --script dspkg_probe.gd; then
            echo "DSPkg registered."
          else
            note_failure "DSPkg is not registered, the extension library did not load"
          fi
          rm -f project/dspkg_probe.gd

          echo "Validating addon GDScript files with Godot..."
          for script in project/addons/directstorage_accelerator/scripts/*.gd project/addons/directstorage_accelerator/tools/*.gd; do
            rel_script="${script#project/}"
            echo "Checking $rel_script..."
            if "$GODOT" --path project --headless --check-only --script "$rel_script"; then
              echo "  ok"
            else
              echo "  FAILED (exit $?)"
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "ERROR: Addon validation failed: ${FAILURES:-one or more GDScript files failed syntax validation}"
            exit 1
          fi
          echo "All addon GDScript files passed syntax validation."
        env:
          GODOT: ${{ env.GODOT }}

      - name: Run gdextest (C++ native tests)
        id: gdextest
        shell: bash
        run: |
          # Tee the runner output: the ❌ blocks that name the failing suite and
          # assertions are printed by gdextest.py (not by Godot), so the failure
          # summary step needs this log to report the real cause.
          set -o pipefail
          python extern/gdextest/tools/gdextest.py test \
            --json=test-results.json \
            --junit=test-results.xml \
            --gdextest-raw-log="${{ github.workspace }}/godot-raw.log" 2>&1 | tee gdextest.log
        env:
          GODOT: ${{ env.GODOT }}

      - name: Cache GUT addon
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.gdscript.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: .cache/gut
          key: gut-${{ hashFiles('tools/fetch_gut.py') }}

      - name: Run GUT (GDScript unit tests)
        id: gut
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.gdscript.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python tools/run_gut.py --godot "$GODOT" 2>&1 | tee gut.log
        env:
          GODOT: ${{ env.GODOT }}

      - name: Publish failure summary
        # Runs for ANY failed step, not just a broken SCons build: a failure in
        # the GDScript validation step previously produced no job summary at
        # all because that step ran after the build-only summary step.
        if: failure()
        shell: bash
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "Publishing build failure summary from scons-build.log"
            python .github/scripts/extract_build_errors.py scons-build.log --kind build
          elif [ "${{ steps.gdscript.outcome }}" = "failure" ]; then
            echo "Publishing validation failure summary from gdscript-check.log"
            python .github/scripts/extract_build_errors.py gdscript-check.log --kind validation
          else
            if [ "${{ steps.gdextest.outcome }}" = "failure" ]; then
              echo "Publishing gdextest failure summary from gdextest.log"
              python .github/scripts/extract_build_errors.py gdextest.log --kind test
            fi
            if [ "${{ steps.gut.outcome }}" = "failure" ]; then
              echo "Publishing GUT failure summary from gut.log"
              python .github/scripts/extract_build_errors.py gut.log --kind test
            fi
          fi

      - name: Show godot raw log head (crash diagnosis)
        # The failure tail only shows the backtrace; the head shows which
        # suite/init step died. Runs on all OSes, never fails the job.
        if: always()
        shell: bash
        run: |
          LOG="${{ github.workspace }}/godot-raw.log"
          if [ -f "$LOG" ]; then
            echo "=== godot-raw.log: $(wc -l < "$LOG") lines; first 150 ==="
            head -n 150 "$LOG"
          else
            echo "godot-raw.log not found; listing workspace root:"
            ls -la "${{ github.workspace }}" | head -n 40
          fi

      - name: Symbolize macOS crash backtrace
        # Resolves the ${TEST_LIB_NAME} offsets from the SIGSEGV
        # backtrace (e.g. +dfdec +aa0b0 +ac7b8 +6038c) to file:line via atos.
        # Best-effort: prints a notice instead of failing if stripped/missing.
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          DYLIB=$(ls bin/${TEST_LIB_NAME}.*.dylib 2>/dev/null | head -n 1 || true)
          if [ -z "$DYLIB" ]; then echo "test dylib not found; skipping atos"; exit 0; fi
          echo "dylib: $DYLIB"
          LOG="${{ github.workspace }}/godot-raw.log"
          OFFSETS=$(grep -o "${TEST_LIB_NAME}[^)]*)" "$LOG" 2>/dev/null | grep -o '+[0-9a-fA-F]*' | tr -d '+' | sort -u || true)
          if [ -z "$OFFSETS" ]; then
            echo "no dylib offsets in raw log; falling back to last-known crash offsets"
            OFFSETS="dfdec aa0b0 ac7b8 6038c"
          fi
          echo "offsets: $OFFSETS"
          # shellcheck disable=SC2086
          xcrun atos -o "$DYLIB" -arch arm64 $OFFSETS || echo "atos failed (dylib may be stripped)"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdextest-results-${{ matrix.os }}
          path: |
            test-results.json
            test-results.xml
            godot-raw.log
            scons-build.log
            gdscript-check.log
            gut.log
            project/gut-results.xml
            gdextest.log
          if-no-files-found: ignore

      - name: Publish gdextest report (GitHub Annotations)
        uses: dorny/test-reporter@v1
        if: always() && hashFiles('test-results.xml') != ''
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/gdextest-reporter-summary.md
        with:
          name: gdextest (${{ matrix.os }})
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Publish GUT report (GitHub Annotations)
        uses: dorny/test-reporter@v1
        if: always() && hashFiles('project/gut-results.xml') != ''
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/gut-reporter-summary.md
        with:
          name: GUT (${{ matrix.os }})
          path: project/gut-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Publish separated test report summaries
        if: always() && (hashFiles('test-results.xml') != '' || hashFiles('project/gut-results.xml') != '')
        shell: bash
        run: |
          python - "${{ runner.temp }}" "$GITHUB_STEP_SUMMARY" << 'PY'
          import os, re, sys
          tmp_dir, out_path = sys.argv[1], sys.argv[2]
          sections = [
              ("gdextest (C++ Native Tests)", os.path.join(tmp_dir, "gdextest-reporter-summary.md")),
              ("GUT (GDScript Unit Tests)", os.path.join(tmp_dir, "gut-reporter-summary.md")),
          ]
          chunks = []
          for title, path in sections:
              if not os.path.isfile(path) or os.path.getsize(path) == 0:
                  continue
              text = open(path, "r", encoding="utf-8", errors="replace").read().strip()
              chunks.append(f"### {title}\n")
              if "<details" in text:
                  chunks.append(text + "\n")
                  continue
              lines = text.splitlines()
              badge = lines[0] if lines and lines[0].startswith("![") else ""
              body = "\n".join(lines[1:] if badge else lines).strip()
              m = re.search(r"(\d+)\s+failed", text)
              n = int(m.group(1)) if m else 0
              label = f"Expand {title} details ({n} test{'s' if n != 1 else ''} failed)" if n > 0 else f"Expand {title} details"
              if badge:
                  chunks.append(badge + "\n")
              chunks.append(f"<details><summary>{label}</summary>\n\n{body}\n\n</details>\n")
          if chunks:
              with open(out_path, "a", encoding="utf-8") as f:
                  f.write("\n".join(chunks) + "\n")
          PY

      - name: Summarize SCons cache
        # Last on purpose: step summaries are concatenated in step order, so the
        # verdict and the failure detail must be written first. This step is a
        # cost note about the build, and it stays silent unless the cache cost the
        # job real time (a cold rebuild) or the build failed.
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.scons-cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.scons-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.scons-cache.outputs.cache-matched-key }}
          CACHE_REF: ${{ github.ref_name }}
        run: |
          python .github/scripts/summarize_scons_cache.py \
            --log scons-build.log \
            ${{ steps.build.outcome == 'failure' && '--build-failed' || '' }}
