# Parallel-agent worktree workflow (worktrunk: `wt switch --create <branch>`).
#
# Hooks execute in Git Bash, so the commands are bash-compatible. pre-start hooks
# block worktree creation, so the new tree is buildable the moment you cd into it:
#
#   1. submodule working trees, seeded from the primary's .git/modules (see
#      tools/wt_bootstrap_submodules.ps1). A per-worktree store would otherwise be
#      a fresh network clone every time, and a private submodule fails with
#      GitHub's 404 "repository not found" whenever the shell has no credential
#      for it - which reads like a wrong URL rather than a missing token.
#   2. a worktree-local .env (see tools/wt_bootstrap_env.ps1) with the shared
#      addon-sync target disabled and the shared SCons object cache wired up.
#   3. one prebuilt godot-cpp, shared by hardlink/junction (see
#      tools/wt_share_godot_cpp.ps1): ~424 MB of generated objects + a ~436 MB
#      static library that SCons' cache cannot share, because a cache hit still
#      writes a real file into the tree. Measured: a built worktree drops from
#      ~1,040 MB to ~149 MB, at ~20 s extra build time (52 s vs 32 s).
#      Remove this block to go back to compiling godot-cpp per worktree.
#   4. the DirectStorage import library + runtime DLLs (see
#      tools/wt_bootstrap_directstorage.ps1). They are EULA-bound and gitignored,
#      so a fresh worktree cannot link without them. Copying ~1.7 MB from the
#      primary is faster than re-fetching and never opens a license window during
#      worktree creation; the hook fails if the primary has not fetched the SDK.
#
# Every other piece of build state is private per worktree by construction:
# .sconsign.dblite, the .obj files written next to their sources,
# project/addons/directstorage_accelerator/bin, build/gdextest, .godot/,
# src/gen/dspkg_encryption_key.h. The build mutex in build_remote.ps1 is keyed on
# the workspace root, so two builds of the SAME worktree still serialize while
# builds in different worktrees run in parallel.
#
# Deliberately NOT using `wt step copy-ignored` here: the export-contract tests
# leave ~3.4 GB of gitignored fixtures behind, and copying object trees or a
# stale .sconsign.dblite per worktree costs disk while saving no compile -
# the shared SCons cache (.cache/scons in the primary worktree) already covers
# the cross-worktree reuse.
#
# Compiler-cache wrappers (USE_CC_WRAPPER=sccache|buildcache) are opt-in and do
# NOT share hits between worktrees - measured: sccache 0.14 and buildcache 0.33.2
# both miss on identical sources in two worktrees (MSVC puts worktree-absolute
# paths in the hashed input; buildcache misses in direct AND preprocessor mode,
# with ACCURACY=DEFAULT and SLOPPY). Their value is CI/remote caching and
# intra-worktree iteration, not parallel worktrees.

# Note the difference from the two hooks below: this one is resolved from the new
# worktree, not the primary, so the branch's own bootstrap tooling is what runs -
# which is also what makes a change to that tooling testable before it lands.
[[pre-start]]
submodules = "powershell -NoProfile -ExecutionPolicy Bypass -File {{ worktree_path }}/tools/wt_bootstrap_submodules.ps1 {{ primary_worktree_path }} {{ worktree_path }}"

[[pre-start]]
godotcpp = "powershell -NoProfile -ExecutionPolicy Bypass -File {{ primary_worktree_path }}/tools/wt_share_godot_cpp.ps1 {{ primary_worktree_path }} {{ worktree_path }}"

# Resolved from the new worktree, like the submodule hook: the tool travels with
# the branch being checked out, so changes to it are testable before they land.
# Both paths are passed explicitly because the script must never infer the primary.
[[pre-start]]
directstorage = "powershell -NoProfile -ExecutionPolicy Bypass -File {{ worktree_path }}/tools/wt_bootstrap_directstorage.ps1 {{ primary_worktree_path }} {{ worktree_path }}"

[[pre-start]]
env = "powershell -NoProfile -ExecutionPolicy Bypass -File {{ primary_worktree_path }}/tools/wt_bootstrap_env.ps1 {{ primary_worktree_path }} -DestinationPath {{ worktree_path }}/.env -GodotCppPrebuilt"
